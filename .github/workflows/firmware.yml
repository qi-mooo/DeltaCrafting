name: Build S3 Firmware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      TDISPLAY_S3_DIR: ${{ github.workspace }}/.firmware-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pinned LILYGO board and display drivers
        uses: actions/checkout@v4
        with:
          repository: Xinyuan-LilyGO/T-Display-S3
          ref: 5c7b97a42e6ed4ec299004f0578c097ece412d6f
          path: .firmware-sdk
          sparse-checkout: |
            boards
            lib/TFT_eSPI
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Verify S3 menu navigation
        run: |
          c++ -std=c++17 -Ifirmware/t-display-s3/include firmware/t-display-s3/tests/ui_state_test.cpp -o /tmp/s3-ui-test
          /tmp/s3-ui-test
      - name: Build and package generic ESP32-S3 firmware
        run: |
          pio run -d firmware/t-display-s3/audio
          pio run -d firmware/t-display-s3
      - name: Verify display and updater recovery
        run: python firmware/t-display-s3/tests/run_native.py
      - name: Build and verify Harp USB firmware
        run: |
          pio run -d firmware/esp32-usb-player
          python firmware/esp32-usb-player/tests/run_native.py
          python firmware/esp32-usb-player/package.py
      - name: Upload Harp USB firmware
        uses: actions/upload-artifact@v4
        with:
          name: DeltaHarp-esp32s3-usb-${{ github.sha }}
          include-hidden-files: true
          path: |
            firmware/esp32-usb-player/.pio/build/esp32-usb-player/DeltaHarp-esp32s3-usb.zip
            firmware/esp32-usb-player/.pio/build/esp32-usb-player/DeltaHarp-esp32s3-usb.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload ESP32-S3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCrafter-esp32s3-${{ github.sha }}
          include-hidden-files: true
          path: |
            firmware/t-display-s3/.pio/build/deltacrafter-monitor/DeltaCrafter-esp32s3.zip
            firmware/t-display-s3/.pio/build/deltacrafter-monitor/DeltaCrafter-esp32s3.zip.sha256
          if-no-files-found: error
          retention-days: 14
