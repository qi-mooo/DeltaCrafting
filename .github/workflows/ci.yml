name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    needs: firmware
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download matching S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: DeltaCrafter-esp32s3-${{ github.sha }}
          path: ${{ runner.temp }}/s3-firmware

      - name: Download matching Harp USB firmware
        uses: actions/download-artifact@v4
        with:
          name: DeltaHarp-esp32s3-usb-${{ github.sha }}
          path: ${{ runner.temp }}/harp-firmware

      - name: Build, test and package Windows app
        shell: pwsh
        run: .\scripts\build-release.ps1 -FirmwareBundle '${{ runner.temp }}\s3-firmware\DeltaCrafter-esp32s3.zip' -HarpFirmwareBundle '${{ runner.temp }}\harp-firmware\DeltaHarp-esp32s3-usb.zip'

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCrafter-win-x64-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  firmware:
    uses: ./.github/workflows/firmware.yml
