name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test and package Windows app
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCrafter-win-x64-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    env:
      TDISPLAY_S3_DIR: ${{ github.workspace }}/.firmware-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned LILYGO board and display drivers
        uses: actions/checkout@v4
        with:
          repository: Xinyuan-LilyGO/T-Display-S3
          ref: 5c7b97a42e6ed4ec299004f0578c097ece412d6f
          path: .firmware-sdk
          sparse-checkout: |
            boards
            lib/TFT_eSPI
            lib/GFX Library for Arduino

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build and package generic ESP32-S3 firmware
        run: pio run -d firmware/t-display-s3

      - name: Upload ESP32-S3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCrafter-esp32s3-${{ github.sha }}
          include-hidden-files: true
          path: |
            firmware/t-display-s3/.pio/build/deltacrafter-monitor/DeltaCrafter-esp32s3.zip
            firmware/t-display-s3/.pio/build/deltacrafter-monitor/DeltaCrafter-esp32s3.zip.sha256
          if-no-files-found: error
          retention-days: 14
