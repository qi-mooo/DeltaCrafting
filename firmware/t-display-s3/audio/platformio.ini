[platformio]
default_envs = windows-audio
boards_dir = ${sysenv.TDISPLAY_S3_DIR}/boards
include_dir = ../include
src_dir = src
; pioarduino cleans alternate Arduino framework versions; keep audio's 3.x
; packages separate from the monitor's stable Arduino 2.x toolchain.
packages_dir = .pio/packages

[env:windows-audio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
    framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9-libs.tar.xz
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.app_partition_name = app1
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_extra_dirs = ${sysenv.TDISPLAY_S3_DIR}/lib
lib_deps = bblanchon/ArduinoJson@6.21.5
lib_ignore =
    GFX Library for Arduino
    arduino-nofrendo
    Adafruit MPR121
    DabbleESP32
    PCF8575 library
    PCA95x5
    lvgl
