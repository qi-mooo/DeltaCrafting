<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>DeltaHarp</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f5f6;background:#111315;letter-spacing:0;font-size:14px;--line:#34383d;--muted:#a1a7ad;--accent:#78dbc4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#22262a;border-radius:5px;min-height:38px;padding:8px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover:not(:disabled){border-color:var(--accent);background:#2b3034}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input,select{background:#191c1f;border:1px solid var(--line);border-radius:5px;min-height:38px;padding:8px 10px;min-width:0}input[type=range]{padding:0;accent-color:var(--accent);width:100%}input[type=checkbox]{accent-color:var(--accent);width:19px;height:19px;min-height:0}svg.icon{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.icon-button{width:38px;padding:7px;flex-shrink:0}.primary{background:var(--accent);color:#101815;border-color:var(--accent)}.primary:hover:not(:disabled){background:#9be5d4;color:#101815}.muted{color:var(--muted)}[hidden]{display:none!important}.wrap{max-width:1060px;margin:0 auto;padding:0 24px}header{border-bottom:1px solid var(--line)}.header-inner{display:flex;align-items:center;gap:12px;min-height:78px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:650;margin:0}.brand .icon{width:26px;height:26px;color:var(--accent)}.device{margin-left:auto;text-align:right;font-size:12px;line-height:1.7}.online{color:var(--accent)}.offline{color:#f0a3a0}.tabs{display:flex;gap:25px;padding-top:14px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:12px 2px;min-width:52px;font-weight:600}.tab[aria-selected=true]{border-color:var(--accent);color:var(--accent)}main{padding-bottom:140px!important}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{position:relative;flex:1;min-width:0}.search>.icon{position:absolute;left:11px;top:10px;color:var(--muted)}.search input{padding-left:38px;width:100%}.count{font-size:12px;color:var(--muted);margin:14px 0}.songs{border-top:1px solid var(--line)}.song{display:grid;grid-template-columns:40px 36px minmax(0,1fr) 64px 38px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #2b2f33;min-height:70px}.song.selected{background:#1c2c29}.song .number{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}.song .name{overflow-wrap:anywhere;font-weight:520;line-height:1.5}.song .path{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}.song .size{font-size:12px;color:var(--muted);text-align:right}.star{border-color:transparent;background:transparent}.star[aria-pressed=true]{color:#f1c96b}.star[aria-pressed=true] svg{fill:#f1c96b26}.song-choice{text-align:left;justify-content:flex-start;border:0;background:transparent;padding:0;display:block;width:100%}.song-choice:hover:not(:disabled){background:transparent}.empty{padding:55px 15px;text-align:center;color:var(--muted)}.empty>.icon{width:32px;height:32px;display:block;margin:0 auto 14px;color:#6e777d}.message{border-left:3px solid #efbc71;background:#2a241c;padding:11px 13px;line-height:1.5;margin:12px 0}.settings{max-width:700px}.settings h2{font-size:16px;margin:26px 0 10px}.setting{display:grid;grid-template-columns:145px minmax(0,1fr) 68px;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.setting output{text-align:right;font-variant-numeric:tabular-nums}.setting label{font-weight:500}.setting .toggle{justify-self:start;display:flex;align-items:center;gap:9px}.setting.wide{grid-template-columns:145px minmax(0,1fr)}.setting input[type=number]{max-width:120px;width:100%}.actions{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}.metadata{display:grid;grid-template-columns:110px minmax(0,1fr);font-size:13px;line-height:1.7;gap:10px;margin-top:18px}.metadata dd,.metadata dt{margin:0;overflow-wrap:anywhere}.metadata dt{color:var(--muted)}.player{position:fixed;bottom:0;left:0;right:0;background:#1a1d20;border-top:1px solid #41464b;z-index:2}.player-inner{min-height:110px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:center;padding-top:14px;padding-bottom:14px}.now{min-width:0}.now-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.now-state{color:var(--muted);font-size:12px;margin-top:5px}.transport{display:flex;gap:9px}.transport button{width:44px;height:42px}.timeline{display:flex;gap:12px;align-items:center;grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.timeline progress{width:100%;height:4px;border:0;accent-color:var(--accent)}progress::-webkit-progress-bar{background:#42494e}progress::-webkit-progress-value{background:var(--accent)}dialog{background:#1b1e22;color:#f4f5f6;border:1px solid #444b51;border-radius:8px;width:min(410px,calc(100% - 32px));padding:24px}dialog::backdrop{background:#090b0dc9}dialog h2{font-size:19px;margin:0 0 20px}dialog label{display:block;font-size:13px;margin:15px 0 7px}dialog input{width:100%}dialog .actions{justify-content:flex-end}.pair-status{min-height:22px;font-size:13px;color:#efbc71;margin-top:12px}.divider{border-top:1px solid var(--line);margin:22px 0}.device .version{color:var(--muted)}.save-state{color:var(--accent);font-size:13px}a{color:var(--accent)}
@media(max-width:580px){.wrap{padding-left:16px;padding-right:16px}.header-inner{min-height:72px;gap:8px}.brand{font-size:20px}.device{max-width:145px}.tabs{gap:20px}.toolbar{gap:7px;flex-wrap:wrap}.toolbar select{max-width:110px}.song{grid-template-columns:34px minmax(0,1fr) 36px;gap:8px;padding:11px 0}.song .number,.song .size{display:none}.song .name{font-size:13px}.song .path{font-size:10px}.setting{grid-template-columns:83px minmax(0,1fr) 55px;gap:10px}.setting.wide{grid-template-columns:83px minmax(0,1fr)}.player-inner{gap:10px}.transport{gap:6px}.transport button{width:39px}.now-title{font-size:13px}.metadata{grid-template-columns:80px minmax(0,1fr)}}
.timeline input{width:100%;min-width:40px;min-height:26px;border:0;background:transparent;padding:0}.timeline span{min-width:38px}.start-control{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}.start-control input{width:93px;font-variant-numeric:tabular-nums;min-height:32px;padding:5px 8px}.start-control .icon-button{height:32px;min-height:32px;width:34px}.start-control label{white-space:nowrap}main{padding-bottom:205px!important}.player-inner{row-gap:8px}.timeline{gap:10px}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#start-saved{width:36px;flex-shrink:0;font-size:12px}
@media(max-width:360px){.start-control{gap:6px}.start-control input{width:86px}}
@media(pointer:coarse){input:not([type=range]):not([type=checkbox]),select{font-size:16px}}
</style>
<!-- ICON_SPRITE -->
<header><div class="wrap header-inner"><h1 class="brand"><svg class="icon"><use href="#icon-music-2"/></svg>DeltaHarp</h1><div class="device"><div id="connection" class="offline">未连接</div><div id="version" class="version">USB MIDI 播放器</div></div><button id="account" class="icon-button" title="登录管理" aria-label="登录管理"><svg class="icon"><use href="#icon-wifi"/></svg></button></div></header>
<main class="wrap">
<nav class="tabs" role="tablist" aria-label="播放器"><button class="tab" role="tab" aria-selected="true" data-tab="library">曲库</button><button class="tab" role="tab" aria-selected="false" data-tab="favorites">收藏 <span id="favorite-count">0</span></button><button class="tab" role="tab" aria-selected="false" data-tab="settings">设置</button></nav>
<div id="message" class="message" role="status" hidden></div>
<section id="library-panel">
<div class="toolbar"><div class="search"><svg class="icon"><use href="#icon-search"/></svg><input id="search" type="search" placeholder="搜索曲目" aria-label="搜索曲目"></div><select id="sort" aria-label="曲目排序"><option value="name">名称排序</option><option value="size">文件大小</option></select><button id="refresh" class="icon-button" title="刷新曲库" aria-label="刷新曲库"><svg class="icon"><use href="#icon-refresh-cw"/></svg></button></div>
<div id="count" class="count">正在连接</div><div id="songs" class="songs"></div>
</section>
<section id="settings-panel" class="settings" hidden>
<h2>播放设置</h2><form id="preferences">
<div class="setting"><label for="speed">速度</label><input id="speed" type="range" min="50" max="200" step="5" value="100"><output id="speed-value">100%</output></div>
<div class="setting"><label for="transpose">移调</label><input id="transpose" type="range" min="-24" max="24" step="1" value="0"><output id="transpose-value">0</output></div>
<div class="setting wide"><label for="countdown">播放倒计时</label><div><input id="countdown" type="number" min="0" max="30" step="1" value="3" required> 秒</div></div>
<div class="setting wide"><label for="loop">单曲循环</label><label class="toggle"><input id="loop" type="checkbox">开启</label></div>
<div class="actions"><button type="submit" class="primary"><svg class="icon"><use href="#icon-settings-2"/></svg>保存设置</button><span id="save-state" class="save-state" role="status"></span></div>
</form>
<h2>存储</h2><div class="setting wide"><span>SD 卡</span><span id="storage">等待连接</span></div><div class="actions"><button id="usb"><svg class="icon"><use href="#icon-usb"/></svg>停止并连接 USB 读卡器</button></div>
<h2>设备</h2><div class="actions"><button id="pair-device"><svg class="icon"><use href="#icon-wifi"/></svg><span id="pair-device-label">开启设备配对</span></button><span id="pairing-state" class="muted" role="status">让 Windows 或 S3 扫描并连接，无需按 BOOT</span></div><dl class="metadata"><dt>固件</dt><dd id="device-version">-</dd><dt>设备 ID</dt><dd id="device-id">-</dd><dt>局域网</dt><dd id="device-ip">-</dd><dt>USB</dt><dd id="device-usb">-</dd></dl>
<div class="actions"><button id="logout"><svg class="icon"><use href="#icon-log-out"/></svg>退出登录</button></div>
</section>
</main>
<footer class="player"><div class="wrap player-inner"><div class="now"><div id="now-title" class="now-title">未选择曲目</div><div id="now-state" class="now-state">停止</div></div><div class="transport"><button id="play" class="primary" title="播放" aria-label="播放" disabled><svg class="icon"><use href="#icon-play"/></svg></button><button id="stop" title="停止" aria-label="停止" disabled><svg class="icon"><use href="#icon-square"/></svg></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="1" step="100" value="0" aria-label="播放进度" disabled><span id="duration">0:00</span></div><div class="start-control"><label for="start-time">起始时间</label><input id="start-time" type="text" inputmode="decimal" placeholder="00:00" value="00:00" maxlength="10" aria-label="起始时间，分秒"><span id="start-saved" class="save-state" role="status"></span><button id="back-ten" class="icon-button" title="后退 10 秒" aria-label="后退 10 秒" disabled><svg class="icon"><use href="#icon-arrow-left"/></svg></button><button id="forward-ten" class="icon-button" title="前进 10 秒" aria-label="前进 10 秒" disabled><svg class="icon"><use href="#icon-arrow-right"/></svg></button></div></div></footer>
<dialog id="login-dialog"><h2>登录 DeltaHarp</h2><form id="login-form"><label for="password">密码</label><input id="password" type="password" minlength="8" maxlength="64" autocomplete="current-password" required><div id="login-status" class="pair-status" role="status"></div><div class="actions"><button id="login-close" type="button">取消</button><button type="submit" class="primary">登录</button></div></form></dialog>
<script>
'use strict';
for(const event of ['gesturestart','gesturechange'])document.addEventListener(event,e=>e.preventDefault(),{passive:false});
const $=id=>document.getElementById(id);
localStorage.removeItem('delta-harp-key');
let session=localStorage.getItem('delta-harp-session')||sessionStorage.getItem('delta-harp-session')||'', state=null, songs=[], favorites=[], selected='', tab='library', connected=false, scanning=false, pending=false, scrubbing=false;
sessionStorage.removeItem('delta-harp-session');
let savedStart=null,startDirty=false,startTimer=0,startSave=Promise.resolve();
const labels={playing:'播放中',paused:'已暂停',stopped:'停止',countdown:'倒计时',loading:'正在加载',error:'播放失败',updating:'固件更新中'};
const errors={sd_busy_retry:'SD 正在写入，稍后重试',sd_changed_retry:'读取期间 SD 已变化，请重试',sd_not_available:'未检测到 SD 卡',update_in_progress:'播放器正在更新',command_queue_full:'播放器忙，请稍后重试',stop_before_refreshing_library:'请停止播放后刷新曲库',favorites_limit_or_save_failed:'收藏已满或保存失败',save_failed:'保存失败，请重试',usb_host_not_connected:'播放器 USB 未连接电脑',midi_open_failed_or_larger_than_512KiB:'文件不存在或超过 512 KiB',midi_memory_limit:'曲目过大，播放器内存不足',invalid_options:'设置数值不正确',invalid_midi:'MIDI 文件无效',start_out_of_range:'起始时间超过曲目时长',seek_out_of_range:'跳转位置超过曲目时长',no_song_loaded:'请先加载并播放曲目'};
function message(text=''){ $('message').textContent=text; $('message').hidden=!text; }
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','icon');const use=document.createElementNS(svg.namespaceURI,'use');use.setAttribute('href','#icon-'+name);svg.append(use);return svg;}
function button(name,label,action){const b=document.createElement('button');b.type='button';b.className='icon-button';b.title=label;b.setAttribute('aria-label',label);b.append(icon(name));b.onclick=action;return b;}
Object.assign(errors,{login_required:'请登录',invalid_password:'密码错误',password_not_configured:'设备尚未设置网页登录密码',too_many_attempts:'尝试次数过多，请 30 秒后重试'});
async function api(path,body,auth=true){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const headers={};if(auth)headers.Authorization='Bearer '+session;if(body!==undefined)headers['Content-Type']='application/json';const response=await fetch('/api/v1/'+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:'no-store'});const result=await response.json();if(!response.ok||!result.ok){if(response.status===401&&auth){session='';localStorage.removeItem('delta-harp-session');connected=false;showLogin();}throw new Error(errors[result.error]||result.error||'请求失败');}return result;}catch(e){if(e.name==='AbortError')throw new Error('连接超时，请重试');if(e instanceof TypeError)throw new Error('设备未连接');throw e;}finally{clearTimeout(timer);}}
function showLogin(){if(!$('login-dialog').open)$('login-dialog').showModal();}
async function collect(path){let rows=[],offset=0,total=0;do{const page=await api(path+'?offset='+offset);rows=rows.concat(page.songs);total=page.total;offset+=page.songs.length;if(!page.songs.length)break;}while(offset<total&&offset<500);return rows;}
async function loadLibrary(){songs=await collect('songs');favorites=await collect('favorites');render();}
function time(ms){const seconds=Math.floor((ms||0)/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
function startLabel(ms){const fraction=ms%1000;return time(ms)+(fraction?'.'+String(fraction).padStart(3,'0').replace(/0+$/,''):'');}
function syncStart(){if(!startDirty&&document.activeElement!==$('start-time')){savedStart=state.startMs||0;$('start-time').value=startLabel(savedStart);}}
async function persistStart(){clearTimeout(startTimer);const value=startTime(),text=$('start-time').value;startSave=startSave.catch(()=>{}).then(async()=>{if(value!==savedStart){await api('preferences',{startMs:value});savedStart=value;if(state)state.startMs=value;}if($('start-time').value===text){startDirty=false;$('start-saved').textContent='已保存';}});return startSave;}
function render(){const query=$('search').value.trim().toLocaleLowerCase();let rows=(tab==='favorites'?favorites:songs).filter(s=>s.name.toLocaleLowerCase().includes(query));rows=[...rows].sort((a,b)=>$('sort').value==='size'?(b.bytes||0)-(a.bytes||0):a.name.localeCompare(b.name,'zh-CN',{numeric:true}));$('favorite-count').textContent=favorites.length;$('count').textContent=scanning?'正在刷新曲库':rows.length+' 首'+(query?' · 搜索结果':'');$('songs').replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.append(icon(tab==='favorites'?'star':'music-2'),document.createTextNode(query?'没有匹配的曲目':tab==='favorites'?'暂无收藏':connected?'曲库为空':'等待连接'));$('songs').append(empty);return;}
rows.forEach((song,i)=>{const row=document.createElement('div');row.className='song'+(song.path===selected?' selected':'');const saved=favorites.some(s=>s.path===song.path);const star=button('star',saved?'取消收藏':'收藏',()=>toggleFavorite(song,star));star.classList.add('star');star.setAttribute('aria-pressed',String(saved));const number=document.createElement('span');number.className='number';number.textContent=String(i+1).padStart(2,'0');const choice=document.createElement('button');choice.className='song-choice';choice.onclick=()=>{selected=song.path;render();renderState();};const name=document.createElement('div');name.className='name';name.textContent=song.name;const path=document.createElement('div');path.className='path';path.textContent=song.path;choice.append(name,path);const size=document.createElement('span');size.className='size';size.textContent=song.bytes?Math.max(1,Math.round(song.bytes/1024))+' KB':'';const play=button('play','播放 '+song.name,()=>command('play',{file:song.path}));play.disabled=!connected||pending||!!state?.busy;row.append(star,number,choice,size,play);$('songs').append(row);});}
async function toggleFavorite(song,button){button.disabled=true;try{await api('favorites',{file:song.path,favorite:!favorites.some(s=>s.path===song.path)});favorites=await collect('favorites');message();render();}catch(e){message(e.message);button.disabled=false;}}
function renderState(){if(!state)return;syncStart();$('pair-device').disabled=!connected||pending||state.state==='updating';const pairing=state.pairingSeconds||0;$('pair-device-label').textContent=pairing?'关闭设备配对':'开启设备配对';$('pairing-state').textContent=pairing?'还剩 '+pairing+' 秒，请在 Windows 或 S3 扫描并连接':'让 Windows 或 S3 扫描并连接，无需按 BOOT';const playing=state.state==='playing'||state.state==='countdown',active=playing||state.state==='paused';$('connection').textContent=connected?'已连接 · '+state.ip:'连接中断';$('connection').className=connected?'online':'offline';$('version').textContent=state.firmware;$('now-title').textContent=(active?state.file:selected||state.file||'未选择曲目').split('/').pop();$('now-state').textContent=(labels[state.state]||state.state)+(state.state==='countdown'?' '+Math.ceil(state.countdownMs/1000)+' 秒':'');$('progress').max=Math.max(1,state.durationMs||0);if(!scrubbing){$('elapsed').textContent=time(state.elapsedMs);$('progress').value=state.elapsedMs||0;}$('duration').textContent=time(state.durationMs);$('progress').disabled=$('back-ten').disabled=$('forward-ten').disabled=!connected||pending||!active||state.busy;$('play').replaceChildren(icon(playing?'pause':'play'));$('play').title=$('play').ariaLabel=playing?'暂停':state.state==='paused'?'继续':'播放';$('play').disabled=!connected||pending||state.busy||(!active&&!selected);$('stop').disabled=!connected||pending||(!active&&!state.busy);$('usb').disabled=!connected||pending||state.state==='updating';$('storage').textContent=state.storage==='usb'?'USB 读卡器已连接':state.storage==='missing'?'未检测到 SD 卡':'磁盘已弹出';$('device-version').textContent=state.firmware;$('device-id').textContent=state.deviceId;$('device-ip').textContent=state.ip;$('device-usb').textContent=state.usbConnected?'已连接':'未连接';}
async function poll(){if(session&&!pending){try{state=await api('status');connected=true;renderState();if(state.error)message(errors[state.error]||state.error);}catch(e){connected=false;$('connection').textContent='未连接';$('connection').className='offline';renderState();if(!$('login-dialog').open)message(e.message);}}setTimeout(poll,1400);}
function startTime(){const text=$('start-time').value.trim(),parts=text.split(':');if(parts.length>2||!parts.every(p=>/^\d+(?:\.\d{1,3})?$/.test(p)))throw new Error('起始时间格式应为 00:30 或秒数');const seconds=parts.length===1?Number(parts[0]):Number(parts[0])*60+Number(parts[1]);if((parts.length===2&&Number(parts[1])>=60)||seconds>3600)throw new Error('起始时间必须在 0:00 至 60:00 之间');return Math.round(seconds*1000);}
async function command(action,body={}){if(pending)return;pending=true;renderState();try{if(action==='play')await persistStart();await api(action,body);if(action==='play')selected=body.file;message();}catch(e){message(e.message);}finally{pending=false;try{state=await api('status');connected=true;}catch{}renderState();render();}}
async function connect(){state=await api('status');connected=true;localStorage.setItem('delta-harp-session',session);$('login-dialog').close();$('password').value='';renderState();const p=await api('preferences');for(const field of ['speed','transpose','countdown'])$(field).value=p[field];$('loop').checked=p.loop;outputs();await loadLibrary();if(!songs.length&&!state.busy&&state.state==='stopped')await refreshLibrary();}
async function refreshLibrary(){if(scanning)return;scanning=true;$('refresh').disabled=true;render();try{await api('library/refresh',{});await new Promise(r=>setTimeout(r,250));for(let n=0;n<60;n++){state=await api('status');renderState();if(!state.busy)break;await new Promise(r=>setTimeout(r,250));}if(state.busy)throw new Error('曲库仍在读取，请稍后刷新');if(state.error)throw new Error(errors[state.error]||state.error);await loadLibrary();message();}catch(e){message(e.message);}finally{scanning=false;$('refresh').disabled=false;render();}}
function outputs(){$('speed-value').textContent=$('speed').value+'%';$('transpose-value').textContent=Number($('transpose').value)>0?'+'+$('transpose').value:$('transpose').value;}
for(const t of document.querySelectorAll('[data-tab]'))t.onclick=async()=>{tab=t.dataset.tab;for(const other of document.querySelectorAll('[data-tab]'))other.setAttribute('aria-selected',String(other===t));$('library-panel').hidden=tab==='settings';$('settings-panel').hidden=tab!=='settings';render();if(tab==='favorites'&&connected){try{favorites=await collect('favorites');render();}catch(e){message(e.message);}}};
$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=refreshLibrary;$('speed').oninput=outputs;$('transpose').oninput=outputs;
$('start-time').oninput=()=>{startDirty=true;$('start-saved').textContent='未保存';clearTimeout(startTimer);startTimer=setTimeout(()=>persistStart().catch(e=>message(e.message)),800);};
$('start-time').onchange=()=>persistStart().catch(e=>message(e.message));
$('play').onclick=()=>command(state?.state==='playing'||state?.state==='countdown'?'pause':state?.state==='paused'?'resume':'play',{file:selected});$('stop').onclick=()=>command('stop');$('usb').onclick=()=>command('storage/usb');
$('pair-device').onclick=()=>command('web/pairing',{enabled:!(state?.pairingSeconds>0)});
$('progress').oninput=()=>{scrubbing=true;$('elapsed').textContent=time(Number($('progress').value));};$('progress').onchange=()=>{const positionMs=Number($('progress').value);scrubbing=false;command('seek',{positionMs});};$('progress').onpointercancel=()=>{scrubbing=false;renderState();};
$('back-ten').onclick=()=>command('seek',{positionMs:Math.max(0,state.elapsedMs-10000)});$('forward-ten').onclick=()=>command('seek',{positionMs:Math.min(state.durationMs,state.elapsedMs+10000)});
$('preferences').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('save-state').textContent='';try{await api('preferences',{speed:Number($('speed').value),transpose:Number($('transpose').value),countdown:Number($('countdown').value),loop:$('loop').checked});$('save-state').textContent='已保存';message();}catch(error){message(error.message);}finally{b.disabled=false;}};
$('account').onclick=showLogin;$('login-close').onclick=()=>$('login-dialog').close();$('logout').onclick=async()=>{try{await api('web/logout',{});}catch(e){message(e.message);return;}session='';localStorage.removeItem('delta-harp-session');connected=false;songs=[];favorites=[];selected='';renderState();render();showLogin();};
$('login-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;$('login-status').textContent='';try{const result=await api('web/login',{password:$('password').value},false);session=result.session;await connect();message();}catch(error){$('login-status').textContent=error.message;}finally{button.disabled=false;}};
if(session)connect().catch(e=>{message(e.message);showLogin();});else showLogin();poll();
</script>
</html>
